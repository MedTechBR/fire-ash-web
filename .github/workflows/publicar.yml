name: Publicar prévia do Fire Ash
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Conferir JavaScript e arquivos da prévia
        run: |
          node --check web/app.js
          python3 tools/verificar_publicacao.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Publicar
        id: publicacao
        uses: actions/deploy-pages@v5
